# Publishes the Bond Expo demo (react-app/) on every push to main:
#   - web:    exports the web build and deploys it to EAS Hosting (production URL)
#   - native: publishes an EAS Update on the "main" branch, openable in Expo Go
#
# Requires the repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
name: Publish Bond demo

on:
  push:
    branches: [main]
    paths:
      - "react-app/**"
      - ".github/workflows/publish-bond.yml"
  workflow_dispatch:

concurrency:
  group: publish-bond
  cancel-in-progress: true

defaults:
  run:
    working-directory: react-app

jobs:
  web:
    name: Deploy web to EAS Hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Export web build
        run: npx expo export --platform web

      - name: Deploy to EAS Hosting
        run: eas deploy --prod --non-interactive

  native:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Publish update
        env:
          # Passed via env (not inlined) so commit text can't inject shell commands.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual publish' }}
        # --json prints the published updates (one per platform) to stdout; logs go to stderr.
        run: eas update --branch main --message "$(echo "$COMMIT_MESSAGE" | head -n 1)" --non-interactive --json > eas-update.json

      # Link and QR code for opening this update in Expo Go, on the run's summary page.
      # Each update group has its own link, so every run gets a new one.
      - name: Add Expo Go link to run summary
        run: |
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const updates = JSON.parse(fs.readFileSync('eas-update.json', 'utf8'));
          const projectId = require('./app.json').expo.extra.eas.projectId;
          const { group, runtimeVersion, message } = updates[0];
          const link = `exp://u.expo.dev/${projectId}/group/${group}`;
          const qr = `https://qr.expo.dev/eas-update?slug=exp&projectId=${projectId}&groupId=${group}`;
          const platforms = updates.map((u) => u.platform).join(', ');
          console.log(`## Open in Expo Go

          Scan with the iPhone Camera app, or from inside Expo Go on Android. Needs the latest Expo Go.

          <img src="${qr}" alt="QR code for opening this update in Expo Go" width="240" height="240" />

          Or open this link on the phone:

          \`\`\`
          ${link}
          \`\`\`

          | | |
          |---|---|
          | Update | ${String(message).replace(/\|/g, "\\|")} |
          | Group | \`${group}\` |
          | Runtime | \`${runtimeVersion}\` |
          | Platforms | ${platforms} |

          It runs as a production build: demo panel changes only last until the app reloads.`.replace(/^ {10}/gm, ''));
          EOF
